# main 에 푸시되면 프로덕션 빌드를 만들어 OCI VM 의 Caddy 정적 디렉터리로 배포한다.
# - 빌드 환경변수는 GitHub Secrets (VITE_*)
# - 배포는 SSH + rsync. 대상: /home/ubuntu/kbuddy-front (Caddy 가 /srv/kbuddy-front 로 마운트)
# - 수동 실행: Actions 탭에서 "Run workflow"
name: Deploy frontend to OCI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
      VITE_KAKAO_SECRET_KEY: ${{ secrets.VITE_KAKAO_SECRET_KEY }}
      VITE_KAKAO_REDIRECT_URI: ${{ secrets.VITE_KAKAO_REDIRECT_URI }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_CLIENT_PW: ${{ secrets.VITE_GOOGLE_CLIENT_PW }}
      VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
      VITE_GOOGLE_SCOPE: ${{ secrets.VITE_GOOGLE_SCOPE }}
      VITE_APPLE_CLIENT_ID: ${{ secrets.VITE_APPLE_CLIENT_ID }}
      VITE_APPLE_REDIRECT_URI: ${{ secrets.VITE_APPLE_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.OCI_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Upload to OCI
        run: |
          # assets 는 해시 파일명이라 먼저 올리고, index.html 은 마지막에 바꿔 배포 중 깨진 참조를 막는다.
          rsync -az --exclude index.html \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/home/ubuntu/kbuddy-front/
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/home/ubuntu/kbuddy-front/

      - name: Verify
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} \
            'ls -la /home/ubuntu/kbuddy-front/index.html && ls /home/ubuntu/kbuddy-front/assets | wc -l'
